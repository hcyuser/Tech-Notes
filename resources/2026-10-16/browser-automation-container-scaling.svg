<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">瀏覽器自動化容器擴展概念圖</title>
  <desc id="desc">任務來源連到多組相同的任務處理器和瀏覽器執行器，結果送往接收端。主機資源與共用服務會限制擴展。</desc>
  <defs>
    <style>
      .bg{fill:#fff}.panel{fill:#f5f8fc;stroke:#b8c9dc;stroke-width:1.5}.unit{fill:#fff;stroke:#5c83aa;stroke-width:1.5}
      .accent{fill:#e8f2fa;stroke:#3975a7;stroke-width:1.8}.ink{fill:#263746}.muted{fill:#536b80}
      .edge{fill:none;stroke:#63809a;stroke-width:2}.label{font:600 20px -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
      .text{font:16px -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
      .small{font:14px -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#63809a"/>
    </marker>
  </defs>
  <rect class="bg" width="900" height="380"/>
  <text x="30" y="40" class="ink label">以相同的執行單位增加處理能力</text>
  <text x="30" y="66" class="muted small">概念示意；實際組數與連線方式依環境設計</text>
  <rect x="30" y="145" width="155" height="84" rx="12" class="accent"/>
  <text x="107" y="181" text-anchor="middle" class="ink text">任務來源</text>
  <text x="107" y="205" text-anchor="middle" class="muted small">待處理工作</text>
  <rect x="235" y="92" width="430" height="210" rx="16" class="panel"/>
  <text x="260" y="122" class="ink text">可重複部署的執行單位</text>
  <rect x="260" y="143" width="380" height="56" rx="10" class="unit"/>
  <text x="280" y="178" class="ink text">第 1 組</text>
  <text x="395" y="178" class="ink text">處理器</text>
  <text x="490" y="178" class="muted text">＋</text>
  <text x="530" y="178" class="ink text">瀏覽器</text>
  <rect x="260" y="219" width="380" height="56" rx="10" class="unit"/>
  <text x="280" y="254" class="ink text">第 N 組</text>
  <text x="395" y="254" class="ink text">處理器</text>
  <text x="490" y="254" class="muted text">＋</text>
  <text x="530" y="254" class="ink text">瀏覽器</text>
  <path d="M185 187H220V171H258" class="edge" marker-end="url(#arrow)"/>
  <path d="M220 187V247H258" class="edge" marker-end="url(#arrow)"/>
  <rect x="715" y="145" width="155" height="84" rx="12" class="accent"/>
  <text x="792" y="181" text-anchor="middle" class="ink text">結果接收端</text>
  <text x="792" y="205" text-anchor="middle" class="muted small">執行結果</text>
  <path d="M640 171H690V187H713" class="edge" marker-end="url(#arrow)"/>
  <path d="M640 247H690V187" class="edge"/>
  <rect x="235" y="328" width="430" height="40" rx="10" class="panel"/>
  <text x="450" y="354" text-anchor="middle" class="muted small">擴展上限取決於主機資源、目標網站與共用服務</text>
</svg>
